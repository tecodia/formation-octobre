version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: graphql-formation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: graphql_user
      POSTGRES_PASSWORD: graphql_password
      POSTGRES_DB: graphql_formation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphql_user -d graphql_formation"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Interface d'administration Adminer
  adminer:
    image: adminer:latest
    container_name: graphql-formation-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
